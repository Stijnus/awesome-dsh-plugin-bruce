name: Expand subscription mappings toward 1000

# When the published Discover index is below the 1000-plugin cap, turn already
# audited eligible sources — and the next 200 unmapped high-star repos — into
# new packages.json entries. Existing keys are never rewritten. Identity-opaque
# npm packages go to mapping-pending.md for AI review. refresh-market-v2 and
# refresh-host-market then pick up the mapping push.

on:
  schedule:
    - cron: '12 16 * * *'
  workflow_run:
    workflows: ['Refresh the official DSH market index']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-expand-subscription-mappings
  cancel-in-progress: false

jobs:
  expand:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix scripts/host-market
      - run: npm test --prefix scripts/host-market
      - name: Skip when the published index already meets the cap
        id: need
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          index = json.loads(Path('data/dsh-market-index.json').read_text())
          count = len(index.get('plugins') or [])
          need = count < 1000
          print(f'published_plugins={count} cap=1000 need={need}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'need={str(need).lower()}\ncount={count}\n')
          PY
      - name: Propose and append eligible mappings
        if: steps.need.outputs.need == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --import ./scripts/host-market/node_modules/tsx/dist/loader.mjs \
            scripts/host-market/expand-mappings.mjs --fill --size 200 --github-api --write-pending
          node scripts/validate-packages.mjs
      - name: Commit new mappings and the AI review queue
        if: steps.need.outputs.need == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            git add data/packages.json data/review/subscription
            if git diff --cached --quiet; then
              echo "No new subscription mappings."
              exit 0
            fi
            git commit -m "data: auto-map eligible DSH subscription candidates"
          }
          stage
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — retrying on origin/main."
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            node --import ./scripts/host-market/node_modules/tsx/dist/loader.mjs \
              scripts/host-market/expand-mappings.mjs --fill --size 200 --github-api --write-pending
            node scripts/validate-packages.mjs
            stage
          done
          echo "Push still rejected after 3 attempts."
          exit 1
